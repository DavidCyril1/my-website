<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Photo Enhancer | Powered By David Cryil</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --gradient-1: #667eea;
      --gradient-2: #764ba2;
      --accent: #6dd5ed;
    }
    body {
      background: linear-gradient(135deg, var(--gradient-1), var(--gradient-2));
      min-height: 100vh;
      font-family: 'Segoe UI', sans-serif;
      color: white;
    }
    .main-card {
      background: rgba(255, 255, 255, 0.15) !important;
      border-radius: 20px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 0 30px rgba(255, 255, 255, 0.1);
      position: relative;
      overflow: hidden;
    }
    .main-card::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(45deg, transparent, rgba(255,255,255,0.1), transparent);
      transform: rotate(45deg);
      animation: glow 8s linear infinite;
      z-index: -1;
    }
    .upload-box {
      border: 3px dashed rgba(255, 255, 255, 0.3);
      background: rgba(255, 255, 255, 0.05);
      transition: all 0.3s ease;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }
    .upload-box:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
      background: rgba(255, 255, 255, 0.1);
    }
    .preview-image {
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      transition: transform 0.3s;
    }
    .preview-image:hover {
      transform: scale(1.02);
    }
    .custom-btn {
      background: linear-gradient(45deg, var(--accent), #2193b0);
      border: none;
      padding: 12px 30px;
      font-weight: 600;
      letter-spacing: 1px;
      position: relative;
      overflow: hidden;
      transition: all 0.3s ease;
    }
    .custom-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(109, 213, 237, 0.4);
    }
    .loader {
            width: 60px;
            height: 60px;
            margin: 2rem auto;
            position: relative;
            display: none;
        }

        .loader::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 4px solid transparent;
            border-top-color: #6dd5ed;
            border-bottom-color: #cc2b5e;
            animation: spin 1s linear infinite;
        }

        .loader::after {
            content: 'R';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.5rem;
            font-weight: bold;
            color: white;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }
    @keyframes glow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .result-card {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 15px;
      backdrop-filter: blur(5px);
    }
    .powered-by {
      opacity: 0.8;
      font-size: 0.9rem;
      letter-spacing: 1px;
    }
    /* Helper class to hide elements until needed */
    .hidden {
      display: none;
    }
  </style>
</head>
<body class="d-flex align-items-center">
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">
        <div class="main-card p-4 p-md-5 mb-4">
          <h1 class="text-center mb-4 fw-bold">
            <i class="fas fa-magic me-2"></i>AI Photo Enhancer
          </h1>
          <!-- Upload Section -->
          <div class="upload-box rounded-3 p-5 text-center mb-4"
               onclick="document.getElementById('fileInput').click()">
            <div class="d-flex flex-column align-items-center">
              <i class="fas fa-cloud-upload-alt fa-3x mb-3"></i>
              <h5 class="mb-2">Drag & Drop or Click to Upload</h5>
              <small class="text-white-50">Supported formats: JPEG, PNG</small>
            </div>
          </div>
          <input type="file" id="fileInput" accept="image/*" class="d-none">
          <!-- Preview Section -->
          <div id="preview-container" class="hidden">
            <div class="result-card p-3 mb-4">
              <img id="imagePreview" class="preview-image w-100 mb-3" alt="Preview Image">
              <button id="enhanceBtn" class="btn custom-btn w-100 hidden">
                <i class="fas fa-wand-magic-sparkles me-2"></i>Enhance Image
              </button>
            </div>
          </div>
          <!-- Loader -->
          <div class="text-center">
            <div class="loader spinner-border text-primary hidden" role="status" id="loader">
              <span class="visually-hidden">Loading...</span>
            </div>
          </div>
          <!-- Result Section -->
          <div id="result-container" class="hidden">
            <div class="result-card p-3">
              <img id="enhancedImage" class="preview-image w-100 mb-3" alt="Enhanced Image">
              <a id="downloadBtn" href="" download="enhanced_image.jpg" 
                 class="btn custom-btn w-100 hidden">
                <i class="fas fa-download me-2"></i>Download Enhanced Image
              </a>
            </div>
          </div>
          <p class="text-center powered-by mt-4 mb-0">Powered by David Cyril</p>
        </div>
      </div>
    </div>
  </div>
  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Enhanced JavaScript with Bootstrap integration
    document.getElementById('fileInput').addEventListener('change', handleFile);
    document.getElementById('enhanceBtn').addEventListener('click', enhanceImage);

    let selectedFile = null;

    function handleFile(event) {
      const file = event.target.files[0];
      if (file) {
        selectedFile = file;
        const reader = new FileReader();
        reader.onload = function (e) {
          document.getElementById('imagePreview').src = e.target.result;
          document.getElementById('preview-container').classList.remove('hidden');
          document.getElementById('enhanceBtn').classList.remove('hidden');
        };
        reader.readAsDataURL(file);
      }
    }

    async function uploadToImgBB(file) {
      const formData = new FormData();
      formData.append('image', file);
      const apiKey = '1fe5c36a643f15d1e5478c716f876a4c';
      try {
        const response = await fetch(`https://api.imgbb.com/1/upload?key=${apiKey}`, {
          method: 'POST',
          body: formData,
        });
        const data = await response.json();
        if (!response.ok || !data.data?.url) {
          throw new Error('Failed to upload image');
        }
        return data.data.url;
      } catch (error) {
        console.error('Upload error:', error);
        showError('Image upload failed. Please try again.');
        throw error;
      }
    }

    async function enhanceImageUsingAPI(imgUrl) {
      const reminiApiUrl = `https://apis.davidcyriltech.my.id/remini?url=${encodeURIComponent(imgUrl)}`;
      try {
        const response = await fetch(reminiApiUrl);
        if (!response.ok) throw new Error('Enhancement failed');
        return await response.blob();
      } catch (error) {
        console.error('Enhancement error:', error);
        showError('Image enhancement failed. Please try again.');
        throw error;
      }
    }

    async function enhanceImage() {
      if (!selectedFile) {
        showError('Please select an image first!');
        return;
      }
      toggleLoading(true);
      try {
        const uploadedUrl = await uploadToImgBB(selectedFile);
        const enhancedBlob = await enhanceImageUsingAPI(uploadedUrl);
        const blobUrl = URL.createObjectURL(enhancedBlob);
        document.getElementById('enhancedImage').src = blobUrl;
        const downloadBtn = document.getElementById('downloadBtn');
        downloadBtn.href = blobUrl;
        downloadBtn.classList.remove('hidden');
        document.getElementById('result-container').classList.remove('hidden');
        document.getElementById('preview-container').classList.add('hidden');
      } finally {
        toggleLoading(false);
      }
    }

    function toggleLoading(loading) {
      const loader = document.getElementById('loader');
      const enhanceBtn = document.getElementById('enhanceBtn');
      if (loading) {
        loader.classList.remove('hidden');
        enhanceBtn.disabled = true;
        enhanceBtn.innerHTML = `<i class="fas fa-spinner fa-spin me-2"></i>Processing...`;
      } else {
        loader.classList.add('hidden');
        enhanceBtn.disabled = false;
        enhanceBtn.innerHTML = `<i class="fas fa-wand-magic-sparkles me-2"></i>Enhance Image`;
      }
    }

    function showError(message) {
      // Create Bootstrap toast notification
      const toast = document.createElement('div');
      toast.className = 'toast align-items-center text-white bg-danger border-0';
      toast.role = 'alert';
      toast.innerHTML = `
        <div class="d-flex">
          <div class="toast-body">${message}</div>
          <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
        </div>
      `;
      document.body.appendChild(toast);
      new bootstrap.Toast(toast).show();
      setTimeout(() => toast.remove(), 5000);
    }
  </script>
</body>
</html>
