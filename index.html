  <!-- JavaScript -->
  <script>
    /* Text Typing Animation for Hero Section */
    const text = "Here you can find some of my projects.";
    const heroText = document.querySelector('.hero-text');
    let i = 0;
    function typeEffect() {
      if(i < text.length) {
        heroText.innerHTML += text.charAt(i);
        i++;
        setTimeout(typeEffect, 100);
      }
    }
    typeEffect();

    /* Infinite Loop Animation for Skill Section menggunakan JavaScript */
const skillList = document.querySelector('.skill-list');
skillList.innerHTML += skillList.innerHTML; // Duplikasi konten
const skillWidth = skillList.scrollWidth / 2; // Lebar asli konten
let position = 0;

function animateSkills() {
  position -= 1; // Kecepatan pergeseran
  skillList.style.transform = `translateX(${position}px)`;
  
  // Ketika animasi melewati ujung, kembalikan ke posisi awal tanpa terlihat reset
  if (Math.abs(position) >= skillWidth) {
    position = 0;
  }
  
  requestAnimationFrame(animateSkills);
}

animateSkills();

    /* Fade-in Effect: Munculkan elemen .glass saat muncul di viewport */
    function revealOnScroll() {
      const glassElements = document.querySelectorAll('.glass');
      glassElements.forEach(el => {
        const rect = el.getBoundingClientRect();
        if(rect.top < window.innerHeight - 50) {
          el.classList.add('visible');
        }
      });
    }
    window.addEventListener('scroll', revealOnScroll);
    window.addEventListener('load', revealOnScroll);

    /* Toggle Dark/Light Mode dan Update Ikon */
function toggleTheme() {
  document.body.classList.toggle('light-mode');
  const themeIcon = document.getElementById('theme-icon');
  const sunIcon = document.getElementById('sun-icon');
  const moonIcon = document.getElementById('moon-icon');

  if (document.body.classList.contains('light-mode')) {
    sunIcon.style.display = 'block';
    moonIcon.style.display = 'none';
  } else {
    sunIcon.style.display = 'none';
    moonIcon.style.display = 'block';
  }
}

// Set ikon awal
document.addEventListener('DOMContentLoaded', () => {
  const sunIcon = document.getElementById('sun-icon');
  const moonIcon = document.getElementById('moon-icon');
  sunIcon.style.display = 'none'; // Default adalah mode gelap (bulan ditampilkan)
  moonIcon.style.display = 'block';
});

  </script>
