<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Chatbot | David Cyril</title>
<meta name="description" content="Chat with GPT-4, DeepSeek, Gemini, Claude, Llama 3 and more. Free AI chatbot.">
<link rel="icon" href="https://files.catbox.moe/4hq1u5.jpg">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--p:#667eea;--p2:#764ba2;--dark:#0F0F0F;--card:#1E1E1E;--glass:rgba(30,30,30,0.85);--gb:rgba(255,255,255,0.1);--text:#fff;--muted:#aaa;--tr:all 0.3s cubic-bezier(0.25,0.8,0.25,1);}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--dark);font-family:'Poppins',sans-serif;color:var(--text);min-height:100vh;overflow-x:hidden;padding:20px;}
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;}
.orb{position:absolute;border-radius:50%;filter:blur(70px);opacity:0.18;}
.o1{width:350px;height:350px;background:#667eea;top:10%;left:5%;animation:fl 16s ease-in-out infinite;}
.o2{width:420px;height:420px;background:#764ba2;top:60%;right:5%;animation:fl 20s ease-in-out infinite 3s;}
.o3{width:280px;height:280px;background:#f093fb;top:35%;left:50%;animation:fl 14s ease-in-out infinite 6s;}
@keyframes fl{0%,100%{transform:translate(0,0);}50%{transform:translate(40px,-40px);}}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px;flex-wrap:wrap;gap:12px;}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;}
.logo i{font-size:2rem;background:linear-gradient(135deg,#667eea,#764ba2);-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.1);}}
.logo span{font-size:1.5rem;font-weight:700;background:linear-gradient(135deg,#667eea,#764ba2);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.back{background:rgba(255,255,255,0.07);border:1px solid var(--gb);color:var(--muted)!important;padding:9px 20px;border-radius:30px;font-size:0.85rem;text-decoration:none;transition:var(--tr);}
.back:hover{background:rgba(255,255,255,0.13);color:#fff!important;}
.chat-container{background:var(--glass);backdrop-filter:blur(14px);border:1px solid var(--gb);border-radius:22px;overflow:hidden;box-shadow:0 12px 50px rgba(0,0,0,0.4);max-width:900px;margin:0 auto;display:flex;flex-direction:column;height:calc(100vh - 140px);min-height:500px;}
.chat-header{padding:18px 24px;border-bottom:1px solid var(--gb);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;}
.chat-title{font-size:1.1rem;font-weight:700;display:flex;align-items:center;gap:10px;}
.model-sel{background:var(--card);border:1.5px solid var(--gb);color:var(--text);padding:8px 14px;border-radius:10px;font-size:0.85rem;font-family:'Poppins',sans-serif;outline:none;cursor:pointer;}
.model-sel:focus{border-color:var(--p);}
.chat-msgs{flex:1;overflow-y:auto;padding:24px;display:flex;flex-direction:column;gap:16px;}
.chat-msgs::-webkit-scrollbar{width:4px;}
.chat-msgs::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);border-radius:2px;}
.msg{display:flex;gap:12px;animation:fu 0.3s ease;}
@keyframes fu{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
.msg.user{flex-direction:row-reverse;}
.avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:0.9rem;flex-shrink:0;margin-top:2px;}
.av-bot{background:linear-gradient(135deg,var(--p),var(--p2));}
.av-user{background:rgba(255,255,255,0.1);}
.bubble{max-width:75%;padding:14px 18px;border-radius:18px;font-size:0.92rem;line-height:1.65;}
.bubble.bot{background:rgba(255,255,255,0.06);border:1px solid var(--gb);border-radius:4px 18px 18px 18px;}
.bubble.user{background:linear-gradient(135deg,var(--p),var(--p2));border-radius:18px 4px 18px 18px;}
.typing{display:flex;gap:6px;align-items:center;padding:14px 18px;}
.dot{width:8px;height:8px;background:var(--muted);border-radius:50%;animation:bounce 1.4s infinite;}
.dot:nth-child(2){animation-delay:0.2s;}
.dot:nth-child(3){animation-delay:0.4s;}
@keyframes bounce{0%,60%,100%{transform:translateY(0);}30%{transform:translateY(-8px);}}
.chat-input{padding:16px 20px;border-top:1px solid var(--gb);display:flex;gap:10px;align-items:flex-end;}
.msg-input{flex:1;background:var(--card);border:1.5px solid var(--gb);border-radius:14px;color:var(--text);padding:13px 18px;font-size:0.92rem;font-family:'Poppins',sans-serif;outline:none;resize:none;min-height:50px;max-height:140px;transition:var(--tr);}
.msg-input:focus{border-color:var(--p);}
.msg-input::placeholder{color:var(--muted);opacity:0.6;}
.send-btn{background:linear-gradient(135deg,var(--p),var(--p2));border:none;color:#fff;width:50px;height:50px;border-radius:14px;cursor:pointer;transition:var(--tr);display:flex;align-items:center;justify-content:center;font-size:1.1rem;flex-shrink:0;}
.send-btn:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(102,126,234,0.4);}
.send-btn:disabled{opacity:0.5;cursor:not-allowed;transform:none;}
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:14px;color:var(--muted);text-align:center;}
.empty-state i{font-size:3rem;background:linear-gradient(135deg,var(--p),var(--p2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.empty-state h3{font-size:1.2rem;font-weight:600;color:var(--text);}
.empty-state p{font-size:0.88rem;max-width:300px;}
.sug-chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:6px;}
.chip{background:rgba(255,255,255,0.06);border:1px solid var(--gb);border-radius:20px;padding:7px 14px;font-size:0.8rem;cursor:pointer;transition:var(--tr);}
.chip:hover{border-color:var(--p);color:var(--p);}
.clear-btn{background:rgba(255,255,255,0.06);border:1px solid var(--gb);color:var(--muted);padding:7px 14px;border-radius:10px;font-size:0.8rem;cursor:pointer;transition:var(--tr);}
.clear-btn:hover{background:rgba(255,0,0,0.1);border-color:rgba(255,0,0,0.3);color:#ff6b6b;}
</style>
</head>
<body>
<div class="bg"><div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div></div>
<div style="max-width:940px;margin:0 auto;">
  <div class="topbar">
    <a href="/" class="logo"><i class="fa fa-robot"></i><span>AI Chatbot</span></a>
    <a href="/" class="back"><i class="fa fa-arrow-left me-1"></i>Home</a>
  </div>
  <div class="chat-container">
    <div class="chat-header">
      <div class="chat-title"><i class="fa fa-robot" style="color:var(--p)"></i> AI Chatbot</div>
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
        <select class="model-sel" id="modelSel">
          <option value="deepseek-v3">DeepSeek V3</option>
          <option value="gpt4">GPT-4</option>
          <option value="gpt4omini">GPT-4o Mini</option>
          <option value="gemini">Gemini</option>
          <option value="claude">Claude</option>
          <option value="llama3">Llama 3</option>
          <option value="mixtral">Mixtral</option>
          <option value="deepseek-r1">DeepSeek R1</option>
          <option value="copilot">Copilot</option>
          <option value="perplexity">Perplexity</option>
        </select>
        <button class="clear-btn" onclick="clearChat()"><i class="fa fa-trash me-1"></i>Clear</button>
      </div>
    </div>
    <div class="chat-msgs" id="msgs">
      <div class="empty-state" id="emptyState">
        <i class="fa fa-robot"></i>
        <h3>Chat with AI</h3>
        <p>Choose a model and start chatting. Powered by David Cyril's API.</p>
        <div class="sug-chips">
          <div class="chip" onclick="useChip(this)">Write a Python script</div>
          <div class="chip" onclick="useChip(this)">Explain quantum computing</div>
          <div class="chip" onclick="useChip(this)">Help me with my code</div>
          <div class="chip" onclick="useChip(this)">Tell me a joke</div>
        </div>
      </div>
    </div>
    <div class="chat-input">
      <textarea class="msg-input" id="msgInput" placeholder="Type your message..." rows="1"></textarea>
      <button class="send-btn" id="sendBtn" onclick="send()"><i class="fa fa-paper-plane"></i></button>
    </div>
  </div>
</div>
<script>
const API='https://apis.davidcyril.name.ng';
const msgs=document.getElementById('msgs');
const input=document.getElementById('msgInput');
let sending=false;
function addMsg(role,text){
  document.getElementById('emptyState')?.remove();
  const d=document.createElement('div');
  d.className=`msg ${role}`;
  d.innerHTML=`<div class="avatar ${role==='bot'?'av-bot':'av-user'}"><i class="fa ${role==='bot'?'fa-robot':'fa-user'}"></i></div><div class="bubble ${role}">${text.replace(/\n/g,'<br>')}</div>`;
  msgs.appendChild(d);
  msgs.scrollTop=msgs.scrollHeight;
  return d;
}
function addTyping(){
  document.getElementById('emptyState')?.remove();
  const d=document.createElement('div');
  d.className='msg bot';d.id='typing';
  d.innerHTML=`<div class="avatar av-bot"><i class="fa fa-robot"></i></div><div class="bubble bot"><div class="typing"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div></div>`;
  msgs.appendChild(d);msgs.scrollTop=msgs.scrollHeight;
  return d;
}
async function send(){
  if(sending)return;
  const txt=input.value.trim();if(!txt)return;
  const model=document.getElementById('modelSel').value;
  input.value='';input.style.height='';
  addMsg('user',txt);
  sending=true;document.getElementById('sendBtn').disabled=true;
  const typer=addTyping();
  try{
    const r=await fetch(`${API}/ai/${model}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:txt})});
    const d=await r.json();
    typer.remove();
    const reply=d.result||d.response||d.message||d.answer||d.data||d.text||(typeof d==='string'?d:'Sorry, I could not get a response. Please try again.');
    addMsg('bot',reply);
  }catch(e){typer.remove();addMsg('bot','Network error. Please check your connection and try again.');}
  sending=false;document.getElementById('sendBtn').disabled=false;
  msgs.scrollTop=msgs.scrollHeight;
}
function clearChat(){msgs.innerHTML='<div class="empty-state" id="emptyState"><i class="fa fa-robot"></i><h3>Chat Cleared</h3><p>Start a new conversation!</p></div>';}
function useChip(el){input.value=el.textContent;input.focus();send();}
input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}});
input.addEventListener('input',()=>{input.style.height='auto';input.style.height=Math.min(input.scrollHeight,140)+'px';});
</script>
</body>
</html>
