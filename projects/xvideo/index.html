<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xxx-Video Downloader</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #4361ee;
            --secondary-color: #3f37c9;
            --accent-color: #4895ef;
            --light-color: #f8f9fa;
            --dark-color: #212529;
            --success-color: #4cc9f0;
            --danger-color: #f72585;
            --border-radius: 8px;
            --box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f5f7fa;
            color: var(--dark-color);
            line-height: 1.6;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }
        
        header {
            text-align: center;
            margin-bottom: 2rem;
        }
        
        h1 {
            font-size: 2.5rem;
            color: var(--primary-color);
            margin-bottom: 0.5rem;
        }
        
        .subtitle {
            color: #6c757d;
            font-size: 1.1rem;
        }
        
        .downloader-container {
            background-color: white;
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
            padding: 2rem;
            margin-bottom: 2rem;
        }
        
        .input-group {
            display: flex;
            margin-bottom: 1.5rem;
        }
        
        .input-group input {
            flex: 1;
            padding: 0.75rem 1rem;
            border: 1px solid #ced4da;
            border-radius: var(--border-radius) 0 0 var(--border-radius);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }
        
        .input-group input:focus {
            border-color: var(--primary-color);
        }
        
        .input-group button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 0 1.5rem;
            border-radius: 0 var(--border-radius) var(--border-radius) 0;
            cursor: pointer;
            font-weight: 500;
            transition: background-color 0.3s;
        }
        
        .input-group button:hover {
            background-color: var(--secondary-color);
        }
        
        .result-container {
            display: none;
            animation: fadeIn 0.5s ease-in-out;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .video-info {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }
        
        .video-thumbnail {
            border-radius: var(--border-radius);
            overflow: hidden;
            box-shadow: var(--box-shadow);
            max-width: 100%;
        }
        
        .video-thumbnail img {
            width: 100%;
            height: auto;
            display: block;
        }
        
        .video-details {
            flex: 1;
        }
        
        .video-title {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
            color: var(--dark-color);
        }
        
        .download-btn {
            display: inline-block;
            background-color: var(--success-color);
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: var(--border-radius);
            text-decoration: none;
            font-weight: 500;
            margin-top: 1rem;
            transition: background-color 0.3s;
        }
        
        .download-btn:hover {
            background-color: #3aa8d8;
        }
        
        .loading {
            display: none;
            text-align: center;
            padding: 1rem;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            margin: 0 auto;
            border: 4px solid rgba(0, 0, 0, 0.1);
            border-left-color: var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .error-message {
            color: var(--danger-color);
            background-color: rgba(247, 37, 133, 0.1);
            padding: 1rem;
            border-radius: var(--border-radius);
            margin-top: 1rem;
            display: none;
        }
        
        footer {
            text-align: center;
            margin-top: 2rem;
            color: #6c757d;
            font-size: 0.9rem;
        }
        
        @media (min-width: 768px) {
            .video-info {
                flex-direction: row;
            }
            
            .video-thumbnail {
                max-width: 300px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Xxx-Video Downloader</h1>
            <p class="subtitle">Download high-quality videos with ease</p>
        </header>
        
        <div class="downloader-container">
            <div class="input-group">
                <input type="text" id="video-url" placeholder="Paste video URL here...">
                <button id="download-btn">Download</button>
            </div>
            
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Processing your request...</p>
            </div>
            
            <div class="error-message" id="error-message">
                An error occurred while processing your request. Please check the URL and try again.
            </div>
            
            <div class="result-container" id="result-container">
                <div class="video-info">
                    <div class="video-thumbnail">
                        <img id="video-thumb" src="" alt="Video thumbnail">
                    </div>
                    <div class="video-details">
                        <h2 class="video-title" id="video-title"></h2>
                        <a href="#" class="download-btn" id="download-link" download>Download Video</a>
                    </div>
                </div>
            </div>
        </div>
        
        <footer>
            <p>© 2023 Xxx-Video Downloader | All Rights Reserved</p>
        </footer>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const videoUrlInput = document.getElementById('video-url');
            const downloadBtn = document.getElementById('download-btn');
            const loading = document.getElementById('loading');
            const resultContainer = document.getElementById('result-container');
            const errorMessage = document.getElementById('error-message');
            const videoThumb = document.getElementById('video-thumb');
            const videoTitle = document.getElementById('video-title');
            const downloadLink = document.getElementById('download-link');
            
            downloadBtn.addEventListener('click', async function() {
                const videoUrl = videoUrlInput.value.trim();
                
                if (!videoUrl) {
                    showError('Please enter a valid video URL');
                    return;
                }
                
                // Validate URL format
                if (!isValidUrl(videoUrl)) {
                    showError('Please enter a valid URL format (e.g., https://example.com/video)');
                    return;
                }
                
                // Show loading, hide results and error
                loading.style.display = 'block';
                resultContainer.style.display = 'none';
                errorMessage.style.display = 'none';
                
                try {
                    // In production, replace this with actual API call:
                    // const response = await fetch(`https://apis.davidcyriltech.my.id/xvideo?url=${encodeURIComponent(videoUrl)}`);
                    // const data = await response.json();
                    
                    // For demo, we'll simulate a successful response
                    const data = await simulateApiCall(videoUrl);
                    
                    if (data.success) {
                        // Display the results
                        videoThumb.src = data.thumbnail;
                        videoTitle.textContent = data.title;
                        downloadLink.href = data.download_url;
                        
                        loading.style.display = 'none';
                        resultContainer.style.display = 'block';
                    } else {
                        showError('Video not found or unavailable');
                    }
                } catch (error) {
                    showError('Failed to process your request. Please try again later.');
                    console.error('API Error:', error);
                }
            });
            
            function isValidUrl(string) {
                try {
                    new URL(string);
                    return true;
                } catch (_) {
                    return false;
                }
            }
            
            function showError(message) {
                loading.style.display = 'none';
                resultContainer.style.display = 'none';
                errorMessage.textContent = message;
                errorMessage.style.display = 'block';
            }
            
            // Simulated API function for demo purposes
            async function simulateApiCall(url) {
                // Simulate network delay
                await new Promise(resolve => setTimeout(resolve, 1500));
                
                // Return mock data structure
                return {
                    "creator": "Video Downloader Service",
                    "success": true,
                    "title": "Your Video Title",
                    "thumbnail": "https://via.placeholder.com/640x360.png?text=Video+Thumbnail",
                    "download_url": "#"
                };
            }
        });
    </script>
</body>
</html>
